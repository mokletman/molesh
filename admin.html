<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Moklet Leadership</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,sans-serif;
            display:flex;flex-direction:column;align-items:center;
            background:#0b0b1a;color:#e2e8f0;padding:24px;overflow-x:hidden;position:relative;
            color-scheme:dark;
        }
        .blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:.4;z-index:0;will-change:transform;pointer-events:none}
        .blob-1{width:480px;height:480px;background:#7c3aed;top:-15%;left:-10%;animation:drift 10s ease-in-out infinite alternate}
        .blob-2{width:360px;height:360px;background:#06b6d4;bottom:-10%;right:-8%;animation:drift 12s ease-in-out infinite alternate-reverse}
        .blob-3{width:260px;height:260px;background:#f43f5e;top:40%;left:55%;animation:drift 14s ease-in-out infinite alternate}
        @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.08)}}
        @keyframes pop{from{opacity:0;transform:translateY(32px) scale(.95)}to{opacity:1;transform:none}}

        .top-bar{
            position:relative;z-index:2;width:100%;max-width:900px;
            display:flex;align-items:center;justify-content:space-between;
            margin-bottom:20px;
        }
        .back-btn{
            display:inline-flex;align-items:center;gap:6px;
            text-decoration:none;color:rgba(255,255,255,.5);
            font-size:.82rem;font-weight:600;padding:8px 14px;border-radius:10px;
            background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
            transition:all .2s;
        }
        .back-btn:hover{background:rgba(255,255,255,.1);color:#e2e8f0}
        .back-btn svg{width:16px;height:16px;fill:currentColor}
        .admin-badge{
            display:inline-flex;align-items:center;gap:6px;
            background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.25);
            border-radius:10px;color:#fb7185;font-size:.75rem;font-weight:700;
            padding:6px 14px;
        }
        .admin-survey-btn{
            border:none;
            background:rgba(59,130,246,.15);
            border:1px solid rgba(125,211,252,.25);
            color:#bfdbfe;
            cursor:pointer;
        }
        .admin-survey-btn:hover{background:rgba(59,130,246,.22);color:#e0f2fe}

        .panel{
            position:relative;z-index:1;width:100%;max-width:900px;
            animation:pop .7s cubic-bezier(.22,1,.36,1) both;
        }
        .panel-title{font-size:1.4rem;font-weight:800;color:#e2e8f0;margin-bottom:4px;text-align:center}
        .panel-subtitle{font-size:.85rem;color:rgba(255,255,255,.4);margin-bottom:24px;text-align:center}

        /* Stats */
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
        .stat{
            background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.1);border-radius:16px;
            padding:20px 16px;text-align:center;
        }
        .stat-num{font-size:1.8rem;font-weight:800;color:#c4b5fd;line-height:1}
        .stat-label{font-size:.72rem;font-weight:600;color:rgba(255,255,255,.4);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

        /* Toolbar */
        .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
        .search-input{
            flex:1;min-width:200px;
            background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
            border-radius:12px;padding:10px 16px;
            font-family:inherit;font-size:.85rem;color:#e2e8f0;outline:none;transition:border-color .2s;
        }
        .search-input::placeholder{color:rgba(255,255,255,.25)}
        .search-input:focus{border-color:rgba(124,58,237,.5)}
        .filter-select{
            background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
            border-radius:12px;padding:10px 14px;
            font-family:inherit;font-size:.82rem;color:#e2e8f0;outline:none;
            -webkit-appearance:none;appearance:none;cursor:pointer;
        }
        .filter-select option{background:#1a1a2e;color:#e2e8f0}
        .export-btn{
            display:inline-flex;align-items:center;gap:6px;
            background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);
            border-radius:12px;color:#4ade80;
            font-family:inherit;font-size:.82rem;font-weight:600;
            padding:10px 16px;cursor:pointer;transition:all .2s;
        }
        .export-btn:hover{background:rgba(34,197,94,.2);color:#86efac}
        .refresh-btn{
            display:inline-flex;align-items:center;gap:6px;
            background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.25);
            border-radius:12px;color:#c4b5fd;
            font-family:inherit;font-size:.82rem;font-weight:600;
            padding:10px 16px;cursor:pointer;transition:all .2s;
        }
        .refresh-btn:hover{background:rgba(124,58,237,.2);color:#ddd6fe}

        .setting-btn{
            display:inline-flex;align-items:center;gap:6px;
            background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25);
            border-radius:12px;color:#fbbf24;
            font-family:inherit;font-size:.82rem;font-weight:600;
            padding:10px 16px;cursor:pointer;transition:all .2s;
        }
        .setting-btn:hover{background:rgba(251,191,36,.2);color:#fde68a}

        /* Tab bar */
        .tab-bar{display:flex;gap:4px;margin-bottom:16px;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;flex-wrap:wrap}
        .tab-btn{
            flex:1 1 140px;text-align:center;padding:10px 12px;border-radius:10px;
            font-family:inherit;font-size:.82rem;font-weight:600;
            color:rgba(255,255,255,.4);background:transparent;border:none;
            cursor:pointer;transition:all .2s;
        }
        .tab-btn.active{background:rgba(124,58,237,.2);color:#c4b5fd}
        .tab-btn:hover:not(.active){color:rgba(255,255,255,.6)}
        .tab-content{display:none}
        .tab-content.active{display:block}

        /* Modal */
        .modal-overlay{
            display:none;position:fixed;inset:0;z-index:100;
            background:rgba(0,0,0,.6);
            justify-content:center;align-items:center;padding:20px;
        }
        .modal-overlay.show{display:flex}
        .modal{
            background:#1a1a2e;border:1px solid rgba(255,255,255,.12);
            border-radius:20px;padding:28px 24px;width:100%;max-width:440px;
            animation:pop .3s cubic-bezier(.22,1,.36,1) both;
            position:relative;z-index:101;
        }
        .modal h3{font-size:1.1rem;font-weight:800;color:#e2e8f0;margin-bottom:4px}
        .modal p{font-size:.82rem;color:rgba(255,255,255,.4);margin-bottom:18px}
        .modal label{display:block;font-size:.75rem;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
        .modal input,.modal select,.modal textarea{
            width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
            border-radius:10px;padding:10px 14px;font-family:inherit;font-size:.85rem;
            color:#e2e8f0;outline:none;margin-bottom:14px;transition:border-color .2s;
            color-scheme:dark;
        }
        .modal input[type="date"]{-webkit-appearance:auto;appearance:auto;min-height:44px;cursor:pointer}
        .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:rgba(124,58,237,.5)}
        .modal select option{background:#1a1a2e;color:#e2e8f0}
        .modal-actions{display:flex;gap:10px;margin-top:6px}
        .modal-actions button{
            flex:1;padding:11px;border-radius:10px;font-family:inherit;font-size:.85rem;
            font-weight:600;cursor:pointer;transition:all .2s;border:none;
        }
        .btn-primary{background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff}
        .btn-primary:hover{opacity:.85}
        .btn-cancel{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1)!important}
        .btn-cancel:hover{background:rgba(255,255,255,.12);color:#e2e8f0}

        /* Checkin cards */
        .ci-cards{display:grid;gap:10px;margin-top:12px}
        .ci-card{
            display:flex;align-items:center;gap:14px;
            background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
            border-radius:14px;padding:14px 16px;
        }
        .ci-card .ci-date{font-size:.9rem;font-weight:700;color:#e2e8f0;white-space:nowrap}
        .ci-card .ci-desc{flex:1;font-size:.78rem;color:rgba(255,255,255,.4);min-width:0;overflow:hidden;text-overflow:ellipsis}
        .ci-card .ci-status{
            font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;
        }
        .ci-status-aktif{background:rgba(34,197,94,.15);color:#4ade80}
        .ci-status-nonaktif{background:rgba(255,255,255,.06);color:rgba(255,255,255,.3)}
        .ci-del{
            background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.2);
            border-radius:8px;color:#fb7185;font-size:.75rem;font-weight:600;
            padding:6px 10px;cursor:pointer;transition:all .2s;font-family:inherit;
        }
        .ci-del:hover{background:rgba(244,63,94,.2);color:#fda4af}
        .ci-count{font-size:.72rem;color:rgba(255,255,255,.3);margin-top:2px}

        /* Table */
        .table-wrap{
            background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.1);border-radius:18px;
            overflow-x:auto;
        }
        .data-table{width:100%;border-collapse:collapse;font-size:.82rem}
        .data-table th{
            background:rgba(255,255,255,.04);
            padding:12px 14px;text-align:left;
            font-size:.7rem;font-weight:700;color:rgba(255,255,255,.4);
            text-transform:uppercase;letter-spacing:.8px;
            border-bottom:1px solid rgba(255,255,255,.08);
            white-space:nowrap;
        }
        .data-table td{
            padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);
            color:#cbd5e1;vertical-align:middle;
        }
        .data-table tr:hover td{background:rgba(255,255,255,.03)}
        .data-table .avatar-cell{width:36px}
        .data-table .mini-avatar{
            width:28px;height:28px;border-radius:8px;object-fit:cover;
            border:1px solid rgba(124,58,237,.3);
        }
        .data-table .mini-avatar-fallback{
            width:28px;height:28px;border-radius:8px;
            background:linear-gradient(135deg,#7c3aed,#06b6d4);
            display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;
        }
        .status-ok{color:#4ade80;font-weight:700}
        .status-no{color:rgba(255,255,255,.25);font-weight:600}

        .empty-state{text-align:center;padding:48px 20px;color:rgba(255,255,255,.3)}
        .empty-state .empty-icon{font-size:2.5rem;margin-bottom:12px}
        .empty-state p{font-size:.88rem;line-height:1.6}

        /* Setup instructions */
        .setup-card{
            background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.1);border-radius:18px;
            padding:32px 28px;text-align:center;max-width:520px;margin:0 auto;
        }
        .setup-card h2{font-size:1.1rem;font-weight:700;color:#fbbf24;margin-bottom:8px}
        .setup-card p{font-size:.85rem;color:rgba(255,255,255,.45);line-height:1.7;margin-bottom:16px}
        .setup-steps{text-align:left;margin:0 auto;max-width:420px}
        .setup-steps li{font-size:.82rem;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:4px}
        .setup-steps code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;font-size:.78rem;color:#c4b5fd}
        .setup-steps a{color:#7dd3fc}

        /* Auth wall */
        .auth-wall{text-align:center;padding:80px 20px}
        .auth-wall .lock-icon{font-size:3rem;margin-bottom:16px}
        .auth-wall h2{font-size:1.2rem;font-weight:700;color:#fb7185;margin-bottom:8px}
        .auth-wall p{font-size:.88rem;color:rgba(255,255,255,.4);line-height:1.6;margin-bottom:20px}
        .auth-wall a{
            display:inline-flex;align-items:center;gap:8px;
            text-decoration:none;color:#c4b5fd;font-weight:600;font-size:.88rem;
            background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.25);
            border-radius:12px;padding:10px 20px;transition:all .2s;
        }
        .auth-wall a:hover{background:rgba(124,58,237,.25)}
        /* Pagination */
        .pagination { display:flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .page-controls { display:flex; gap: 8px; }
        .page-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; padding: 6px 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .page-btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-info { align-self: center; }

        .footer{position:relative;z-index:1;margin-top:28px;font-size:.7rem;color:rgba(255,255,255,.25);text-align:center}

        @media(max-width:640px){
            .stats{grid-template-columns:1fr}
            .data-table{font-size:.75rem}
            .data-table th,.data-table td{padding:8px 10px}
            .toolbar{flex-direction:column}
        }

        /* Analysis Tab Styles */
        .analysis-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-top: 16px; }
        .analysis-card {
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px; padding: 24px; transition: all .3s;
            position: relative; overflow: hidden;
        }
        .analysis-card::after {
            content: ''; position: absolute; top: 0; right: 0; width: 60px; height: 60px;
            background: linear-gradient(135deg, transparent 50%, rgba(124,58,237,0.05) 50%);
            border-radius: 0 0 0 100%;
        }
        .analysis-card:hover { transform: translateY(-4px); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
        .analysis-card h4 { font-size: 1.1rem; color: #fbbf24; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .analysis-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 0.75rem; }
        .analysis-stat-item { background: rgba(255,255,255,.04); padding: 4px 10px; border-radius: 8px; color: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.03); }
        .analysis-topic { font-size: 0.7rem; color: #7dd3fc; background: rgba(125,211,252,0.1); padding: 2px 8px; border-radius: 6px; margin-right: 4px; }
        .analysis-summary { display: grid; gap: 14px; margin-bottom: 12px; }
        .analysis-block {
            background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px; padding: 14px 16px;
        }
        .analysis-block-title {
            font-size: 0.78rem; font-weight: 700; letter-spacing: .02em;
            text-transform: uppercase; color: #c4b5fd; margin-bottom: 8px;
        }
        .analysis-list {
            margin: 0; padding-left: 18px; color: #e2e8f0;
            font-size: 0.84rem; line-height: 1.65;
        }
        .analysis-list li + li { margin-top: 6px; }
        .analysis-keywords { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 12px; font-style: italic; line-height: 1.6; }
        .sentiment-badge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
        .sentiment-pos { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
        .sentiment-neu { background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.15); }
        .sentiment-neg { background: rgba(244,63,94,0.15); color: #fb7185; border: 1px solid rgba(244,63,94,0.25); }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="top-bar">
        <a class="back-btn" href="index.html">
            <svg viewBox="0 0 20 20"><path d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"/></svg>
            Kembali
        </a>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
            <span class="admin-badge">🛡️ Admin Panel</span>
            <button class="admin-badge admin-survey-btn" type="button" onclick="openSurveyTab()">🗳️ Survey Kelas</button>
        </div>
    </div>

    <div class="panel" id="mainPanel">
        <!-- Content injected by JS -->
    </div>

    <p class="footer">© 2026 Moklet Leadership &bull; SMK Telkom Malang</p>

    <script src="config.js"></script>
    <script>
        var ADMIN_EMAIL = (typeof MOLESH_CONFIG !== 'undefined') ? MOLESH_CONFIG.ADMIN_EMAIL : 'hadi@smktelkom-mlg.sch.id';
        var API_URL = (typeof MOLESH_CONFIG !== 'undefined') ? MOLESH_CONFIG.APPS_SCRIPT_URL : 'YOUR_APPS_SCRIPT_URL';
        var panel = document.getElementById('mainPanel');
        var allStudents = [];
        var studentPage = 1;
        var checkinLogPage = 1;
        var refleksiPage = 1;
        var surveyPage = 1;
        var ITEMS_PER_PAGE = 10;
        var allSurveyIdeas = [];
        var _surveyLoaded = false;

        /* ── Auth check ── */
        function checkAdmin() {
            var raw = localStorage.getItem('molesh_user');
            if (!raw) { showAuthWall('Kamu belum login.'); return false; }
            try {
                var user = JSON.parse(raw);
                if (user.email !== ADMIN_EMAIL) {
                    showAuthWall('Halaman ini hanya untuk admin (' + ADMIN_EMAIL + ').');
                    return false;
                }
                return true;
            } catch (e) {
                showAuthWall('Session tidak valid.');
                return false;
            }
        }

        function showAuthWall(msg) {
            panel.innerHTML =
                '<div class="auth-wall">' +
                '<div class="lock-icon">🔒</div>' +
                '<h2>Akses Ditolak</h2>' +
                '<p>' + msg + '</p>' +
                '<a href="index.html">← Kembali ke Beranda</a></div>';
        }

        /* ── Main panel ── */
        function initPanel() {
            if (API_URL === 'YOUR_APPS_SCRIPT_URL') {
                showSetupInstructions();
                return;
            }
            showLoading();
            fetchData();
        }

        function showSetupInstructions() {
            panel.innerHTML =
                '<h1 class="panel-title">🛡️ Admin Panel</h1>' +
                '<p class="panel-subtitle">Dashboard monitoring siswa Moklet Leadership</p>' +
                '<div class="setup-card">' +
                '<h2>⚠️ Backend Belum Dikonfigurasi</h2>' +
                '<p>Untuk mengaktifkan admin panel, setup Google Apps Script sebagai backend.</p>' +
                '<ol class="setup-steps">' +
                '<li>Buka <a href="https://docs.google.com/spreadsheets/create" target="_blank">Google Sheet baru</a></li>' +
                '<li>Klik <strong>Extensions → Apps Script</strong></li>' +
                '<li>Copy-paste kode dari file <code>_gas_backend.gs</code></li>' +
                '<li>Klik <strong>Deploy → New deployment</strong></li>' +
                '<li>Type: <strong>Web app</strong>, Execute as: <strong>Me</strong>, Access: <strong>Anyone</strong></li>' +
                '<li>Copy URL deployment</li>' +
                '<li>Paste di <code>config.js</code> → <code>APPS_SCRIPT_URL</code></li>' +
                '</ol></div>';
        }

        function showLoading() {
            panel.innerHTML =
                '<h1 class="panel-title">🛡️ Admin Panel</h1>' +
                '<p class="panel-subtitle">Memuat data siswa...</p>' +
                '<div class="empty-state"><div class="empty-icon">⏳</div><p>Fetching data dari server...</p></div>';
        }

        /* ── Fetch data ── */
        function fetchData() {
            fetch(API_URL)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    allStudents = data;
                    renderDashboard();
                })
                .catch(function (err) {
                    panel.innerHTML =
                        '<h1 class="panel-title">🛡️ Admin Panel</h1>' +
                        '<p class="panel-subtitle">Dashboard monitoring siswa</p>' +
                        '<div class="empty-state"><div class="empty-icon">❌</div>' +
                        '<p>Gagal memuat data.<br><small style="color:rgba(255,255,255,.25)">' + err.message + '</small></p></div>';
                });
        }

        /* ── Render dashboard ── */
        function renderDashboard() {
            var total = allStudents.length;
            var withProfile = allStudents.filter(function (s) { return s.nama && s.kelas; }).length;

            /* Count per kelas */
            var kelasCount = {};
            allStudents.forEach(function (s) {
                if (s.kelas) { kelasCount[s.kelas] = (kelasCount[s.kelas] || 0) + 1; }
            });
            var topKelas = '—';
            var topCount = 0;
            for (var k in kelasCount) {
                if (kelasCount[k] > topCount) { topCount = kelasCount[k]; topKelas = k; }
            }
            var kelasList = Object.keys(kelasCount).sort();

            var html =
                '<h1 class="panel-title">🛡️ Admin Panel</h1>' +
                '<p class="panel-subtitle">Dashboard monitoring siswa Moklet Leadership</p>';

            /* Stats */
            html += '<div class="stats">' +

        function buildRow(s, i) {
            var initial = ((s.googleName || s.nama || '?')[0] || '?').toUpperCase();
            var avatar = s.picture
                ? '<img class="mini-avatar" src="' + s.picture + '" alt="" onerror="this.outerHTML=\'<div class=mini-avatar-fallback>' + initial + '</div>\'">'
                : '<div class="mini-avatar-fallback">' + initial + '</div>';
            var displayName = s.nama || s.googleName || '—';
            var kelas = s.kelas || '<span style="color:rgba(255,255,255,.2)">—</span>';
            var absen = s.absen || '<span style="color:rgba(255,255,255,.2)">—</span>';
            var lastLogin = s.lastLogin ? formatDate(s.lastLogin) : '—';
            var profileStatus = (s.nama && s.kelas && s.absen)
                ? '<span class="status-ok">✅</span>'
                : '<span class="status-no">❌</span>';

            return '<tr data-nama="' + (displayName).toLowerCase() + '" data-email="' + (s.email || '').toLowerCase() + '" data-kelas="' + (s.kelas || '') + '">' +
                '<td>' + (i + 1) + '</td>' +
                '<td class="avatar-cell">' + avatar + '</td>' +
                '<td><strong>' + displayName + '</strong></td>' +
                '<td style="font-size:.75rem;color:rgba(255,255,255,.4)">' + (s.email || '—') + '</td>' +
                '<td>' + kelas + '</td>' +
                '<td style="text-align:center">' + absen + '</td>' +
                '<td style="font-size:.72rem;color:rgba(255,255,255,.35)">' + lastLogin + '</td>' +
                '<td style="text-align:center">' + profileStatus + '</td></tr>';
        }

        function formatDate(iso) {
            try {
                var d = new Date(iso);
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' +
                    d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            } catch (e) { return iso; }
        }

        /* ── Filter ── */
        function filterTable(resetPage) {
            if (resetPage) studentPage = 1;
            var q = document.getElementById('searchInput').value.toLowerCase();
            var kelas = document.getElementById('filterKelas').value;
            
            var filtered = allStudents.filter(function(s) {
                var sNama = (s.nama || s.googleName || '').toLowerCase();
                var sEmail = (s.email || '').toLowerCase();
                var sKelas = (s.kelas || '');
                var matchQ = !q || sNama.indexOf(q) > -1 || sEmail.indexOf(q) > -1;
                var matchK = !kelas || sKelas === kelas;
                return matchQ && matchK;
            });
            
            var totalItems = filtered.length;
            var totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;
            if (studentPage > totalPages) studentPage = totalPages;
            
            var start = (studentPage - 1) * ITEMS_PER_PAGE;
            var end = start + ITEMS_PER_PAGE;
            var paginated = filtered.slice(start, end);
            
            var html = '';
            if (totalItems === 0) {
                html = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📭</div><p>Tidak ada data siswa.</p></div></td></tr>';
            } else {
                paginated.forEach(function(s, i) {
                    html += buildRow(s, start + i);
                });
            }
            document.getElementById('tableBody').innerHTML = html;
            
            var pageHtml = '';
            if (totalItems > 0) {
                pageHtml = '<div class="pagination">' +
                    '<span class="page-info">Menampilkan ' + (start + 1) + '-' + Math.min(end, totalItems) + ' dari ' + totalItems + ' data</span>' +
                    '<div class="page-controls">' +
                    '<button class="page-btn" onclick="studentPage=1;filterTable()" ' + (studentPage === 1 ? 'disabled' : '') + '>Awal</button>' +
                    '<button class="page-btn" onclick="studentPage--;filterTable()" ' + (studentPage === 1 ? 'disabled' : '') + '>Prev</button>' +
                    '<span class="page-info">Hal ' + studentPage + ' / ' + totalPages + '</span>' +
                    '<button class="page-btn" onclick="studentPage++;filterTable()" ' + (studentPage === totalPages ? 'disabled' : '') + '>Next</button>' +
                    '<button class="page-btn" onclick="studentPage=' + totalPages + ';filterTable()" ' + (studentPage === totalPages ? 'disabled' : '') + '>Akhir</button>' +
                    '</div></div>';
            }
            document.getElementById('studentPagination').innerHTML = pageHtml;
        }

        /* ── Export CSV ── */
        function exportCSV() {
            if (!allStudents.length) return;
            var csv = 'No,Nama,Email,Kelas,No Absen,Google Name,Login Terakhir,Profil Updated\n';
            allStudents.forEach(function (s, i) {
                csv += (i + 1) + ',' +
                    '"' + (s.nama || '').replace(/"/g, '""') + '",' +
                    '"' + (s.email || '') + '",' +
                    '"' + (s.kelas || '') + '",' +
                    (s.absen || '') + ',' +
                    '"' + (s.googleName || '') + '",' +
                    '"' + (s.lastLogin || '') + '",' +
                    '"' + (s.profileUpdated || '') + '"\n';
            });
            var blob = new Blob([csv], { type: 'text/csv' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'molesh_students_' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        var ciSettings = [];
        var ciLogs = [];
        var _selectedTanggal = ''; /* track date picker value reliably */
        var _saving = false; /* prevent double submit */
        var _dateListenerAttached = false;

        function openCheckinModal() {
            document.getElementById('ciModal').classList.add('show');
            var now = new Date();
            var todayStr = now.getFullYear() + '-' +
                String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0');
            var dtInput = document.getElementById('ciTanggal');
            dtInput.value = todayStr;
            _selectedTanggal = todayStr;
            updateTanggalPreview(todayStr);
            document.getElementById('ciDeskripsi').value = '';
            document.getElementById('ciStatus').value = 'aktif';

            /* Attach event listeners when modal opens (Android reliability) */
            if (!_dateListenerAttached) {
                dtInput.addEventListener('change', handleDateChange);
                dtInput.addEventListener('input', handleDateChange);
                dtInput.addEventListener('blur', handleDateChange);
                _dateListenerAttached = true;
            }
            /* Force re-read value after a tick */
            setTimeout(function(){
                _selectedTanggal = dtInput.value;
                updateTanggalPreview(dtInput.value);
            }, 100);
        }

        function handleDateChange(e) {
            var val = e.target.value;
            _selectedTanggal = val;
            updateTanggalPreview(val);
            console.log('Date changed to:', val);
        }

        function closeCheckinModal() {
            document.getElementById('ciModal').classList.remove('show');
        }
        function updateTanggalPreview(val){
            var el = document.getElementById('ciTanggalPreview');
            if(!el) return;
            if(!val){ el.textContent=''; return; }
            el.textContent = '📅 ' + formatTanggalLong(val);
        }

        function saveCheckinSetting() {
            if (_saving) {
                console.log('Already saving, skipping...');
                return;
            }

            /* Read from input directly, then from tracked variable */
            var tanggalInput = document.getElementById('ciTanggal');
            var tanggal = tanggalInput.value || _selectedTanggal;
            var deskripsi = document.getElementById('ciDeskripsi').value;
            var status = document.getElementById('ciStatus').value;
            
            console.log('Save attempt - input.value:', tanggalInput.value, '| tracked:', _selectedTanggal, '| final:', tanggal);

            if (!tanggal) { alert('Tanggal wajib diisi!'); return; }

            /* IMPORTANT: Keep tanggal as string YYYY-MM-DD, do NOT convert to Date object */
            /* Show confirmation with formatted date */
            var previewDate = formatTanggalLong(tanggal);
            if (!confirm('Simpan jadwal kehadiran?\n\nTanggal: ' + previewDate + '\nDeskripsi: ' + (deskripsi||'-') + '\nStatus: ' + status)) return;

            _saving = true;
            var saveBtn = document.querySelector('.btn-primary');
            var origText = saveBtn.textContent;
            saveBtn.textContent = '⏳ Menyimpan...';
            saveBtn.disabled = true;

            /* Send tanggal as pure string YYYY-MM-DD (no Date conversion!) */
            console.log('Sending to backend - tanggal:', tanggal, 'type:', typeof tanggal);
            var payload = JSON.stringify({ action: 'saveCheckinSetting', tanggal: tanggal, deskripsi: deskripsi, status: status });
            fetch(API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: payload })
                .then(function(){
                    closeCheckinModal();
                    setTimeout(function(){ 
                        loadCheckinData(); 
                        _saving = false;
                        saveBtn.textContent = origText;
                        saveBtn.disabled = false;
                    }, 1500);
                })
                .catch(function(err){ 
                    alert('Gagal menyimpan: ' + err.message); 
                    _saving = false;
                    saveBtn.textContent = origText;
                    saveBtn.disabled = false;
                });
        }

        function deleteCheckinSetting(id) {
            if (!confirm('Yakin hapus jadwal kehadiran ini?')) return;
            var payload = JSON.stringify({ action: 'deleteCheckinSetting', id: id });
            fetch(API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: payload })
                .then(function(){
                    setTimeout(function(){ loadCheckinData(); }, 1500);
                })
                .catch(function(err){ alert('Gagal menghapus: ' + err.message); });
        }

        function renderCheckinSettings(el) {

                var tanggal = s.tanggal;

                    var y = tanggal.getFullYear();

                    tanggal = y + '-' + m + '-' + d;

                    tanggal = tanggal.slice(0,10);

        var allReflections = [];
        var _refLoaded = false;

        function loadReflections() {
            var wrap = document.getElementById('refTableWrap');
            var stats = document.getElementById('refStats');
            if (!wrap) return;
            wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><p>Memuat data refleksi...</p></div>';

            fetch(API_URL + '?type=reflections')
                .then(function(r){ return r.json(); })
                .then(function(data){
                    var studentMap = {};
                    allStudents.forEach(function(s) {
                        if(s.email) studentMap[s.email.toLowerCase()] = s;
                    });

                    data.forEach(function(r) {
                        var email = (r.email || '').toLowerCase();
                        if (studentMap[email]) {
                            r.nama = studentMap[email].nama || r.nama;
                            r.kelas = studentMap[email].kelas || r.kelas;
                            r.absen = studentMap[email].absen || r.absen;
                            r.googleName = studentMap[email].googleName || r.googleName;
                        }
                    });
                    
                    data.sort(function(a, b) {
                        var dateA = new Date(a.submittedAt || 0);
                        var dateB = new Date(b.submittedAt || 0);
                        return dateB - dateA;
                    });
                    
                    allReflections = data;
                    _refLoaded = true;
                    renderRefStats(stats);
                    renderReflections(wrap);
                })
                .catch(function(err){
                    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><p>Gagal memuat: ' + err.message + '</p></div>';
                });
        }

        function renderRefStats(el) {
            if (!el) return;
            var total = allReflections.length;
            var perSesi = {};

        function filterReflections(resetPage) {
            if (resetPage) refleksiPage = 1;
            var q = (document.getElementById('refSearchInput')||{}).value;
            q = q ? q.toLowerCase() : '';
            var sesi = (document.getElementById('filterSesi')||{}).value;

            var filtered = allReflections.filter(function(r) {

                var matchS = !sesi || (r.sesi||'').toString() === sesi;
                var matchK = !kelasFilter || (r.kelas||'') === kelasFilter;

        function getSurveyClassList() {
            var set = {};
            var list = [];
            allStudents.forEach(function (s) {
                if (s.kelas && !set[s.kelas]) { set[s.kelas] = true; list.push(s.kelas); }
            });
            allSurveyIdeas.forEach(function (s) {
                if (s.kelas && !set[s.kelas]) { set[s.kelas] = true; list.push(s.kelas); }
            });
            return list.sort();
        }

        function parseSurveyTraits(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            if (typeof value === 'string') {
                if (value.indexOf('||') > -1) {
                    return value.split('||').map(function (v) { return v.trim(); }).filter(Boolean);
                }
                return value.split(',').map(function (v) { return v.trim(); }).filter(Boolean);
            }
            return [];
        }

        function refreshSurveyClassFilter() {
            var select = document.getElementById('filterSurveyClass');
            if (!select) return;
            var current = select.value || '';
            var classes = getSurveyClassList();
            var html = '<option value="">Semua Kelas</option>';
            classes.forEach(function (k) {
                html += '<option value="' + k + '">' + k + '</option>';
            });
            select.innerHTML = html;
            if (!current) return;
            var hasCurrent = classes.some(function (k) { return k === current; });
            select.value = hasCurrent ? current : '';
        }

        function loadSurveyIdeas() {
            var wrap = document.getElementById('surveyTableWrap');
            var stats = document.getElementById('surveyStats');
            if (!wrap) return;
            wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><p>Memuat data survey karakter...</p></div>';

            fetch(API_URL + '?type=surveyIdeas')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var studentMap = {};
                    allStudents.forEach(function (s) {
                        if (s.email) studentMap[s.email.toLowerCase()] = s;
                    });

                    data = Array.isArray(data) ? data : [];

                    data.forEach(function (r) {
                        var email = (r.email || '').toLowerCase();
                        if (studentMap[email]) {
                            r.nama = studentMap[email].nama || r.nama;
                            r.kelas = studentMap[email].kelas || r.kelas;
                            r.absen = studentMap[email].absen || r.absen;
                            r.googleName = studentMap[email].googleName || r.googleName;
                        }
                        r.recordKey = r.recordKey || '';
                        r.traits = r.traits || '';
                        r.otherTrait = r.otherTrait || '';
                        r.note = r.note || '';
                        r.createdAt = r.createdAt || '';
                        r.updatedAt = r.updatedAt || r.createdAt || '';
                    });

                    data.sort(function (a, b) {
                        return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
                    });

                    allSurveyIdeas = data;
                    _surveyLoaded = true;
                    refreshSurveyClassFilter();
                    renderSurveyStats(stats, getFilteredSurveyIdeas());
                    renderSurveyIdeas(wrap);
                })
                .catch(function (err) {
                    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><p>Gagal memuat survey: ' + err.message + '</p></div>';
                });

            var q = (document.getElementById('surveySearchInput') || {}).value || '';
            q = q.toLowerCase();
            var kelasFilter = (document.getElementById('filterSurveyClass') || {}).value || '';

            return allSurveyIdeas.filter(function (r) {
                var traitsText = parseSurveyTraits(r.traits).join(' ').toLowerCase();
                var otherText = (r.otherTrait || '').toLowerCase();
                var noteText = (r.note || '').toLowerCase();
                var matchQ = !q || (r.nama || r.googleName || '').toLowerCase().indexOf(q) > -1 ||
                    (r.email || '').toLowerCase().indexOf(q) > -1 ||
                    (r.kelas || '').toLowerCase().indexOf(q) > -1 ||
                    traitsText.indexOf(q) > -1 ||
                    otherText.indexOf(q) > -1 ||
                    noteText.indexOf(q) > -1;
                var matchK = !kelasFilter || (r.kelas || '') === kelasFilter;
                return matchQ && matchK;
            });
        }

        function renderSurveyStats(el, filteredData) {
            if (!el) return;

            var total = source.length;

            source.forEach(function (r) {
                if (r.kelas) byClass[r.kelas] = (byClass[r.kelas] || 0) + 1;
                parseSurveyTraits(r.traits).forEach(function (t) {
                    byTrait[t] = (byTrait[t] || 0) + 1;
                });
                if (r.otherTrait) {
                    byTrait[r.otherTrait] = (byTrait[r.otherTrait] || 0) + 1;
                }
            });

            var topClass = '—';
            var topClassCount = 0;
            Object.keys(byClass).forEach(function (k) {
                if (byClass[k] > topClassCount) { topClassCount = byClass[k]; topClass = k; }
            });

            var topTrait = '—';
            var topTraitCount = 0;
            Object.keys(byTrait).forEach(function (k) {
                if (byTrait[k] > topTraitCount) { topTraitCount = byTrait[k]; topTrait = k; }

        function runAnalysis() {
            var wrap = document.getElementById('analysisWrap');
            if (!wrap) return;

            if (allReflections.length === 0) {
                if (!_refLoaded) {
                    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><p>Memuat data untuk analisa...</p></div>';

                    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Tidak ada data refleksi untuk dianalisa.</p></div>';
                    return;
                }

                var k = r.kelas || 'Tanpa Kelas';
                if (!grouped[k]) grouped[k] = { reflections: [], totalBySesi: {} };
                grouped[k].reflections.push(r);
                grouped[k].totalBySesi[r.sesi] = (grouped[k].totalBySesi[r.sesi] || 0) + 1;
            });

            var sortedClasses = Object.keys(grouped).sort();
            var html = '<div class="analysis-grid">';

            sortedClasses.forEach(function(k) {
                var data = grouped[k];
                var analysis = analyzeReflectionSet(data.reflections);
                var count = analysis.validCount;
                var sentiment = analysis.sentimentScore;
                var topSesi = getTopSesi(data.totalBySesi);
                var commonKeywords = analysis.keywords;
                
                var sentimentClass = 'sentiment-neu';
                var sentimentLabel = 'Neutral';
                if (sentiment > 0.15) { sentimentClass = 'sentiment-pos'; sentimentLabel = 'Positif'; }
                else if (sentiment < -0.05) { sentimentClass = 'sentiment-neg'; sentimentLabel = 'Perlu Perhatian'; }

                html += '<div class="analysis-card">' +
                    '<h4>🏫 Kelas ' + k + '</h4>' +

                        '<span class="analysis-stat-item">📝 ' + count + ' refleksi</span>' +
                        '<span class="analysis-stat-item">🎯 Sesi ' + topSesi + ' aktif</span>' +
                        '<span class="analysis-stat-item">🚀 ' + analysis.actionReadyText + '</span>' +
                        '<span class="sentiment-badge ' + sentimentClass + '">' + sentimentLabel + '</span>' +
                    '</div>' +
                    '<div class="analysis-summary">' + analysis.summaryHtml + '</div>' +
                    '<div class="analysis-keywords">' +
                        '<strong>Topik dominan:</strong> ' + commonKeywords.map(function(t){ return '<span class="analysis-topic">' + escHtml(t) + '</span>'; }).join('') +
                    '</div>' +
                    '</div>';
            });

            html += '</div>';
            wrap.innerHTML = html;
        }

        function normalizeText(text) {
            return ' ' + (text || '')
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim() + ' ';
        }

        function containsKeyword(text, keyword) {
            var normalizedKeyword = normalizeText(keyword).trim();
            if (!normalizedKeyword) return false;
            return text.indexOf(' ' + normalizedKeyword + ' ') > -1;
        }

        function containsAnyKeyword(text, keywords) {
            if (!keywords || !keywords.length) return false;
            for (var i = 0; i < keywords.length; i++) {
                if (containsKeyword(text, keywords[i])) return true;
            }
            return false;
        }

        function countKeywordHits(text, keywords) {
            var hits = 0;
            if (!keywords) return hits;
            keywords.forEach(function(keyword) {
                if (containsKeyword(text, keyword)) hits += 1;
            });
            return hits;
        }

        function analyzeSentiment(refls) {
            var score = 0;
            var counted = 0;
            
            refls.forEach(function(r) {
                var text = normalizeText(r.refleksi || '');
                if (text.trim().length === 0) return;
                counted += 1;
                score += countKeywordHits(text, POSITIVE_SENTIMENT_WORDS);
                score -= countKeywordHits(text, NEGATIVE_SENTIMENT_WORDS) * 1.2;
            });
            return counted > 0 ? score / counted : 0;
        }

        function getTopSesi(bySesi) {
            var max = 0;
            var top = '—';
            for (var s in bySesi) {
                if (bySesi[s] > max) { max = bySesi[s]; top = s; }
            }
            return top;
        }

        function extractKeywords(refls, fallbackTopics) {
            var stopWords = [
                'saya', 'aku', 'kami', 'kita', 'dan', 'di', 'yang', 'ini', 'itu', 'untuk', 'dengan', 'ada', 'dari', 'bisa',
                'jadi', 'sudah', 'lebih', 'bahwa', 'adalah', 'karena', 'dalam', 'agar', 'pada', 'atau', 'juga', 'tidak',
                'masih', 'sangat', 'setelah', 'sebelum', 'tetapi', 'seperti', 'akan', 'ingin', 'mau', 'saat', 'supaya'
            ];
            var counts = {};
            refls.forEach(function(r) {
                var words = normalizeText(r.refleksi || '').trim().split(/\s+/);
                words.forEach(function(w) {
                    if (w.length > 3 && stopWords.indexOf(w) === -1) {
                        counts[w] = (counts[w] || 0) + 1;
                    }
                });
            });
            var keywords = Object.keys(counts)
                .sort(function(a, b) { return counts[b] - counts[a]; })
                .slice(0, 5);
            if (keywords.length) return keywords;
            return (fallbackTopics || []).slice(0, 5).map(function(item) { return item.label; });
        }

        function uniqueList(items) {
            var seen = {};
            return items.filter(function(item) {
                if (!item || seen[item]) return false;
                seen[item] = true;
                return true;
            });
        }

        function sortSignals(counts, type) {
            return ANALYSIS_SIGNALS
                .filter(function(signal) {
                    return signal.type === type && counts[signal.key];
                })
                .sort(function(a, b) {
                    return counts[b.key] - counts[a.key];
                });
        }

        function joinSignalLabels(signals, fallbackText) {
            if (!signals || !signals.length) return fallbackText || 'belum ada pola yang menonjol';
            var labels = signals.map(function(signal) { return signal.label; });
            if (labels.length === 1) return labels[0];
            if (labels.length === 2) return labels[0] + ' dan ' + labels[1];
            return labels.slice(0, -1).join(', ') + ', dan ' + labels[labels.length - 1];
        }

        function buildTeacherActions(strengths, challenges, actionRate) {
            var actions = [];

            if (strengths.length) {
                actions.push('Pertahankan aktivitas yang menguatkan ' + strengths[0].label + ' karena tema ini paling sering muncul di kelas.');
            } else {
                actions.push('Gunakan pertanyaan refleksi yang lebih terarah agar siswa lebih mudah menuliskan insight yang spesifik.');
            }

            if (challenges.length) actions.push(challenges[0].teacherAction);

            if (actionRate < 0.5) {
                actions.push('Tutup sesi berikutnya dengan target 1 langkah kecil yang spesifik: apa yang dilakukan, kapan, dan bagaimana guru mengeceknya.');
            } else {
                actions.push('Awali sesi berikutnya dengan follow-up 3 menit untuk mengecek apakah rencana aksi siswa benar-benar dijalankan.');
            }

            return uniqueList(actions).slice(0, 3);
        }

        function buildStudentActions(strengths, challenges, actionRate) {
            var actions = [];

            if (strengths.length) {
                actions.push('Pertahankan ' + strengths[0].label + ' dengan satu tindakan nyata di kelas, rumah, atau tim minggu ini.');
            } else {
                actions.push('Tuliskan refleksi dengan lebih konkret: apa yang dipelajari, apa yang dirasakan, dan apa yang akan dilakukan.');
            }

            if (challenges.length) actions.push(challenges[0].studentAction);

            if (actionRate < 0.5) {
                actions.push('Ubah refleksimu menjadi satu aksi 24 jam ke depan yang jelas: apa, kapan, dan dengan siapa.');
            } else {
                actions.push('Jalankan satu aksi yang sudah kamu rencanakan lalu evaluasi hasilnya pada refleksi berikutnya.');
            }

            return uniqueList(actions).slice(0, 3);
        }

        function renderAnalysisBlock(title, items) {
            return '<div class="analysis-block">' +
                '<div class="analysis-block-title">' + escHtml(title) + '</div>' +
                '<ul class="analysis-list">' +
                items.map(function(item) {
                    return '<li>' + escHtml(item) + '</li>';
                }).join('') +
                '</ul>' +
                '</div>';
        }

        function analyzeReflectionSet(refls) {
            if (!refls || !refls.length) {
                return {
                    validCount: 0,
                    sentimentScore: 0,
                    actionReadyText: 'Belum ada data aksi',
                    keywords: ['belum cukup data'],
                    summaryHtml: renderAnalysisBlock('Ringkasan Kelas', ['Belum ada data refleksi yang bisa dianalisa.'])
                };
            }

            var validCount = 0;
            var actionCount = 0;
            var signalCounts = {};

            refls.forEach(function(r) {
                var text = normalizeText(r.refleksi || '');
                if (text.trim().length === 0) return;

                validCount += 1;

                ANALYSIS_SIGNALS.forEach(function(signal) {
                    var matched = containsAnyKeyword(text, signal.keywords);
                    if (matched && signal.excludeKeywords && containsAnyKeyword(text, signal.excludeKeywords)) matched = false;
                    if (matched) signalCounts[signal.key] = (signalCounts[signal.key] || 0) + 1;
                });

                if (containsAnyKeyword(text, ACTION_PLAN_KEYWORDS)) actionCount += 1;
            });

            var strengths = sortSignals(signalCounts, 'strength').slice(0, 2);
            var challenges = sortSignals(signalCounts, 'challenge').slice(0, 2);
            var actionRate = validCount > 0 ? actionCount / validCount : 0;
            var sentimentScore = analyzeSentiment(refls);
            var actionReadyText = actionRate >= 0.75
                ? 'Aksi siap ditindaklanjuti'
                : actionRate >= 0.45
                    ? 'Aksi mulai terbentuk'
                    : 'Aksi masih perlu diarahkan';

            var summaryItems = [];
            summaryItems.push('Tema yang paling sering muncul: ' + joinSignalLabels(strengths, 'belum ada tema positif yang dominan') + '.');
            if (challenges.length) {
                summaryItems.push('Area yang masih perlu didampingi: ' + joinSignalLabels(challenges) + '.');
            } else {
                summaryItems.push('Belum tampak hambatan dominan; fokus berikutnya adalah menjaga konsistensi praktik baik yang sudah muncul.');
            }
            summaryItems.push(actionCount + ' dari ' + validCount + ' refleksi (' + Math.round(actionRate * 100) + '%) sudah menyebut langkah atau niat aksi ke depan.');

            var teacherActions = buildTeacherActions(strengths, challenges, actionRate);
            var studentActions = buildStudentActions(strengths, challenges, actionRate);
            var derivedTopics = uniqueList(strengths.concat(challenges).map(function(signal) {
                return signal.topic || signal.label;
            }));
            var keywordTopics = extractKeywords(refls, []).filter(function(topic) {
                return derivedTopics.indexOf(topic) === -1;
            });
            var topics = derivedTopics.concat(keywordTopics).slice(0, 5);

            return {
                validCount: validCount,
                sentimentScore: sentimentScore,
                actionReadyText: actionReadyText,
                keywords: topics.length ? topics : ['belum cukup data'],
                summaryHtml:
                    renderAnalysisBlock('Ringkasan Kelas', summaryItems) +
                    renderAnalysisBlock('Tindak Lanjut Guru', teacherActions) +
                    renderAnalysisBlock('Tindak Lanjut Siswa', studentActions)
            };
        }

        function formatTanggal(str) {
            /* Format YYYY-MM-DD to DD-MM-YYYY (string manipulation only, no Date object) */
            if (!str) return '—';
            try {
                var parts = str.split('-');
                if (parts.length === 3) {
                    return parts[2] + '-' + parts[1] + '-' + parts[0]; /* DD-MM-YYYY */
                }
                return str;
            } catch(e){ return str; }
        }

        function formatTanggalLong(str) {
            /* Format YYYY-MM-DD to long Indonesian date for confirmation */
            if (!str) return '—';
            try {
                var parts = str.split('-');
                if (parts.length === 3) {
                    var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                    var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
                    /* Use UTC to avoid timezone offset */
                    var d = new Date(parts[0] + '-' + parts[1] + '-' + parts[2] + 'T00:00:00Z');
                    return hari[d.getUTCDay()] + ', ' + parseInt(parts[2]) + ' ' + bulan[parseInt(parts[1])-1] + ' ' + parts[0];
                }
                return str;
            } catch(e){ return str; }
        }

        /* ── Init ── */
        if (checkAdmin()) {
            initPanel();
        }
    </script>

    <!-- Kehadiran Setting Modal -->
    <div class="modal-overlay" id="ciModal">
        <div class="modal">
            <h3>📅 Tambah Jadwal Kehadiran</h3>
            <p>Atur tanggal kehadiran untuk siswa. Siswa hanya bisa kehadiran pada tanggal yang aktif.</p>
            <label>Tanggal</label>
            <input type="date" id="ciTanggal" onchange="_selectedTanggal=this.value;updateTanggalPreview(this.value)">

            <select id="ciStatus">
                <option value="aktif">✅ Aktif</option>
                <option value="nonaktif">⏸️ Nonaktif</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCheckinModal()">Batal</button>
                <button class="btn-primary" onclick="saveCheckinSetting()">💾 Simpan</button>
            </div>
        </div>
    </div>
